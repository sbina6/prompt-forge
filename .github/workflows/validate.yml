name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Run the checks
        run: python tests/run_checks.py
      - name: Build the installable zip
        run: python tools/package_skill.py

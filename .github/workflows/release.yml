name: release

# Publishes a GitHub release for the version in the VERSION file.
#
# Ways to start it:
#   1. In the Actions tab, open this workflow and press "Run workflow" on the main branch.
#   2. Push a tag such as v1.1.
#   3. Publish a release for that tag in the GitHub interface; the workflow then attaches the zip.
#
# The zip is always built from the source being released, so it matches the tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: Work out the tag from the VERSION file
        run: echo "TAG=v$(cat VERSION)" >> "$GITHUB_ENV"
      - name: A manual run has to be on the main branch
        if: github.event_name == 'workflow_dispatch'
        run: test "${GITHUB_REF_NAME}" = "main"
      - name: A pushed tag has to match the VERSION file
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "${TAG}"
      - name: Run the checks
        run: python tests/run_checks.py
      - name: Build the installable zip
        run: python tools/package_skill.py
      - name: Write the release notes from the changelog
        run: python tools/release_notes.py > release-notes.md
      - name: Publish the release, or attach the zip to one that already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.zip --clobber
          else
            gh release create "${TAG}" dist/*.zip \
              --target "${GITHUB_SHA}" \
              --title "Prompt Forge $(cat VERSION)" \
              --notes-file release-notes.md
          fi
